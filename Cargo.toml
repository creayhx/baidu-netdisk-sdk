[package]
name = "baidu-netdisk-sdk"
version = "0.1.4"
edition = "2021"
description = "A Rust SDK for Baidu NetDisk Open Platform API"
license = "MIT"
repository = "https://github.com/creayhx/baidu-netdisk-sdk"
documentation = "https://docs.rs/baidu-netdisk-sdk"
keywords = ["baidu", "netdisk", "cloud-storage", "sdk", "api"]
categories = ["api-bindings", "asynchronous", "network-programming"]
authors = ["CC"]
readme = "README.md"
exclude = [".git/*", ".github/*", "target/*", "docs/*"]

[lib]
name = "baidu_netdisk_sdk"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }

# HTTP client
reqwest = { version = "0.13", features = [
    "json",
    "native-tls",
    "form",
    "stream",
    "multipart",
] }

# Error handling
thiserror = "2.0.18"

# Logging
log = "0.4.29"
env_logger = "0.11"

# URL handling
url = "2.3"
serde_urlencoded = "0.7"
urlencoding = "2.1"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

async-trait = "0.1"

# Environment variable config
dotenv = "0.15"

# Async stream handling
futures = "0.3"

# MD5
md5 = "0.8"
